<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">ToyStore Analytics — architecture concept</title><desc id="desc">Architecture illustration of a test storefront's GA4-compatible event instrumentation. No live purchases or conversion metrics are shown.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17202C"/><stop offset="1" stop-color="#164E5B"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D7E9E9" stroke-opacity=".1"/></pattern></defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#g)"/><rect x="57" y="53" width="236" height="35" rx="17" fill="#1E4655" stroke="#4B8791"/><text x="175" y="76" text-anchor="middle" font-size="14" letter-spacing="1.4" font-family="Arial,sans-serif" font-weight="700" fill="#96F2DD">TAG MANAGEMENT</text><text x="57" y="184" font-family="Arial,sans-serif" font-size="65" font-weight="800" fill="#FFFFFF">Event-driven</text><text x="57" y="260" font-family="Arial,sans-serif" font-size="65" font-weight="800" fill="#96F2DD">Analytics</text><text x="58" y="326" font-family="Arial,sans-serif" font-size="22" fill="#D5E4ED">Make storefront interactions measurable</text><text x="58" y="360" font-family="Arial,sans-serif" font-size="22" fill="#D5E4ED">with a tested dataLayer event contract.</text><rect x="57" y="411" width="525" height="61" rx="17" fill="#1E4655" stroke="#4B8791"/><text x="319" y="451" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#EEFAFF">JEKYLL · JAVASCRIPT · GTM · GA4</text><text x="57" y="558" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.4" fill="#AAC4CD">CONCEPT DIAGRAM  /  NOT A DEPLOYMENT SCREENSHOT</text><g transform="translate(715 83)"><rect width="448" height="448" rx="26" fill="#0E2A39" stroke="#4B8791" stroke-width="2"/><text x="27" y="56" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.5" font-weight="700" fill="#96F2DD">EVENT INSTRUMENTATION FLOW</text><rect x="28" y="92" width="390" height="84" rx="14" fill="#1E4655" stroke="#4B8791"/><rect x="43" y="106" width="48" height="54" rx="11" fill="#96F2DD" fill-opacity=".16"/><text x="67" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#96F2DD">1</text><text x="107" y="124" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Storefront events</text><text x="107" y="149" font-family="Arial,sans-serif" font-size="14.5" fill="#BFCFDE">Add to cart, checkout and contact</text><rect x="28" y="202" width="390" height="84" rx="14" fill="#1E4655" stroke="#4B8791"/><rect x="43" y="216" width="48" height="54" rx="11" fill="#96F2DD" fill-opacity=".16"/><text x="67" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#96F2DD">2</text><text x="107" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">JavaScript dataLayer</text><text x="107" y="259" font-family="Arial,sans-serif" font-size="14.5" fill="#BFCFDE">Structured, testable event payloads</text><rect x="28" y="312" width="390" height="84" rx="14" fill="#1E4655" stroke="#4B8791"/><rect x="43" y="326" width="48" height="54" rx="11" fill="#96F2DD" fill-opacity=".16"/><text x="67" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#96F2DD">3</text><text x="107" y="344" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">GTM to GA4</text><text x="107" y="369" font-family="Arial,sans-serif" font-size="14.5" fill="#BFCFDE">Tag-trigger analytics integration</text></g></svg>